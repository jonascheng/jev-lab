[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev"
version = "0.1.0"
description = "CLI tool to test TypeSafe Jev decision model capabilities on Cloudflare Workers AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jonas Cheng" }
]
dependencies = [
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "pywebview>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
jev = "jev.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jev"]
